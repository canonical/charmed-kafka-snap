log.dirs=/var/snap/charmed-kafka/common/var/log/kafka

super.users=User:admin
process.roles=broker,controller
node.id=1

listeners=INTERNAL://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=INTERNAL
listener.security.protocol.map=INTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
advertised.listeners=INTERNAL://localhost:9092,CONTROLLER://localhost:9093
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="adminpass" user_admin="adminpass" user_user1="pass1";
listener.name.internal.sasl.enabled.mechanisms=SCRAM-SHA-512

authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=true

controller.quorum.bootstrap.servers=localhost:9093
controller.listener.names=CONTROLLER

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

num.partitions=1
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
